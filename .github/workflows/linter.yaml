  markdown:
    name: MarkdownLint
    needs: common-check
    runs-on: ubuntu-22.04
    if: needs.common-check.outputs.continue == 'true'
    permissions:
      pull-requests: read
    steps:
      - name: Set git fetch depth
        run: |
          if [[ ${{ github.event_name }} != 'pull_request' ]]; then
              echo "FETCH_DEPTH=2" >> "$GITHUB_ENV"
          else
              echo "FETCH_DEPTH=0" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
      - uses: tj-actions/changed-files@v42
        id: changed-files
        with:
          files: '**/*.{md,mdx}'
          separator: ","
      - uses: DavidAnson/markdownlint-cli2-action@v16.0.0
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          globs: ${{ steps.changed-files.outputs.all_changed_files }}
          separator: ","
          fix: true

  commit:
    name: CommitLint
    needs: common-check
    runs-on: ubuntu-22.04
    if: needs.common-check.outputs.continue == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install commitlint dependencies
        run: npm install --location=global @commitlint/config-conventional @commitlint/cli
      - uses: wagoid/commitlint-github-action@v5
        with:
          configFile: commitlint.config.js
          failOnWarnings: false
          helpURL: https://datagrok.ai/help/develop/dev-process/git-policy#commit-message-policy

  pr-name:
    name: PR name
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      # https://github.com/JulienKode/pull-request-name-linter-action/issues/236
      - name: Install commitlint dependencies
        run: npm install @commitlint/config-conventional@v17 @commitlint/cli
      - name: Commitlint PR title
        uses: JulienKode/pull-request-name-linter-action@v0.5.0
        with:
          configuration-path: ./commitlint.config.js

  packages-links:
    name: Packages links
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check links in packages
        shell: bash
        continue-on-error: true
        timeout-minutes: 15
        id: test-links
        run: |
          test_result=$(./packages_help.sh)
          if [ -z "$test_result" ]; then
            echo "All tests finished successfully"
          else
            echo -e "${test_result}"
            echo -e "SLACK_MESSAGE_BODY=${test_result}\n\n" | sed -e '$ ! s/$/\\n/' | tr -d '\n' >> $GITHUB_ENV
            exit 1
          fi
        working-directory: packages/
      - name: Prepare Slack Message
        id: slack-prepare
        if: ${{ steps.test-links.outcome == 'failure' }}
        shell: bash
        env:
          SLACK_ID: ${{ secrets.SLACK_ID }}
          # Read as variables rather than interpolated into the script text: a branch name or
          # commit subject containing backticks or $(...) would otherwise be executed by bash.
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TREE_URL: ${{ github.server_url }}/${{ github.repository }}/tree
          COMMIT_URL_BASE: ${{ github.server_url }}/${{ github.repository }}/commit
        run: |
          set -eu

          channel_id=$(jq -r --arg a "$ACTOR" '.[$a]' <<<"$SLACK_ID")
          echo "::add-mask::$channel_id"
          echo "SLACK_CHANNEL=$channel_id" >> "$GITHUB_ENV"

          subject=$(git log --format=%s -n 1 "$COMMIT_SHA")
          # The consumer pastes this into a JSON payload literal, so a bare backslash or quote
          # would make it unparseable and fail the send. Backslashes first, or the escapes
          # added for the quotes would themselves get escaped.
          subject="${subject//\\/\\\\}"
          subject="${subject//\"/\\\"}"

          header="GitHub <${RUN_URL}|${WORKFLOW_NAME} ${RUN_NUMBER}> found dangling help links in packages:"
          context="*Branch:* <${TREE_URL}/${REF_NAME}|${REF_NAME}>\n*Commit:* <${COMMIT_URL_BASE}/${COMMIT_SHA}|${COMMIT_SHA:0:8} ${subject}>"

          # Delimiter form, because a newline in the value would otherwise let it declare
          # further variables for every later step in the job.
          {
            echo "SLACK_MESSAGE_HEADER<<__GH_HEADER_EOF__"
            printf '%s\n' "$header"
            echo "__GH_HEADER_EOF__"
            echo "SLACK_MESSAGE_CONTEXT<<__GH_CONTEXT_EOF__"
            printf '%s\n' "$context"
            echo "__GH_CONTEXT_EOF__"
          } >> "$GITHUB_ENV"

          body=$(printf '%s' "${SLACK_MESSAGE_BODY:-}" | sed -e 's/"/\\"/g' | sed -e '$ ! s/$/\\n/' | tr -d '\n')
          echo "SLACK_MESSAGE_BODY=$body" >> "$GITHUB_ENV"

      - name: Send test report to Slack
        id: slack
        if: ${{ steps.slack-prepare.outcome == 'success' }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL }}
          payload: |
            {
                "blocks": [
                    {
                        "type": "section",
                        "text": {
                            "type": "mrkdwn",
                            "text": "${{ env.SLACK_MESSAGE_HEADER }}"
                        }
                    },
                    {
                        "type": "section",
                        "text": {
                            "type": "mrkdwn",
                            "text": "${{ env.SLACK_MESSAGE_BODY }}"
                        }
                    },
                    {
                        "type": "context",
                        "elements": [
                            {
                                "type": "mrkdwn",
                                "text": "${{ env.SLACK_MESSAGE_CONTEXT }}"
                            }
                        ]
                    }
                ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACKBOT_TOKEN }}
