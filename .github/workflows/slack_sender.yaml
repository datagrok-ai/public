name: Report job failure
on:
  workflow_dispatch: { }
  workflow_run:
    # Scoped to the CI/build workflows whose failures warrant a Slack ping, instead of
    # '*' which fired once per completed run of EVERY workflow (mostly skipped no-ops).
    workflows:
      - Packages
      - Libraries
      - JS API
      - Grok Connect
      - Tools Package
      - Docusaurus
      - Python API
      - misc
      - Lint
      - IaC
    types:
      - completed

jobs:
  notify-on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.actor != 'dependabot[bot]' && github.event.workflow_run.pull_requests[0].user.login != 'dependabot[bot]' }}
    steps:
#      - name: Check for failures and send slack notification
#        if: ${{ github.event.workflow_run.conclusion == 'failure' && github.actor != 'dependabot[bot]' }}
#        run: |
#          echo ${{ github.event.workflow_run }}
#          SLACK_MESSAGE=$(echo "Workflow failed: ${{ github.event.workflow_run.html_url }}")
#          key="${{ github.actor }}"
#          value=$(echo '${{ secrets.SLACK_ID }}' | jq -r ".${key}")
#          curl -X POST -H 'Content-type: application/json' -H "Authorization: Bearer ${{ secrets.SLACKBOT_TOKEN }}" \
#          --data '{"text":"'"${SLACK_MESSAGE}"'", "channel":"'$value'"}' \
#          https://slack.com/api/chat.postMessage

      - name: Prepare Slack Message
        id: slack-user
        shell: bash
        env:
          SLACK_ID: ${{ secrets.SLACK_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job runs on the default branch with repository secrets, and the values below
          # come from the run that triggered it -- a commit message can contain backticks or
          # $(...). GitHub substitutes ${{ }} into the script text before bash parses it, so
          # interpolating them inline would execute them. Read them as variables instead.
          ACTOR: ${{ github.actor }}
          JOBS_URL: ${{ github.event.workflow_run.jobs_url }}
          RUN_HTML_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_commit.id }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          TREE_URL: ${{ github.server_url }}/${{ github.repository }}/tree
          COMMIT_URL_BASE: ${{ github.server_url }}/${{ github.repository }}/commit
        run: |
          set -eu

          channel_id=$(jq -r --arg a "$ACTOR" '.[$a]' <<<"$SLACK_ID")
          echo "::add-mask::$channel_id"
          echo "SLACK_CHANNEL=$channel_id" >> "$GITHUB_ENV"

          jobs=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$JOBS_URL")

          # First line only, without a pipe: `... | head -n1` makes head close the pipe on a
          # long message, and the resulting SIGPIPE fails the step.
          subject="${HEAD_MESSAGE%%$'\n'*}"
          # The consumer pastes this into a JSON payload literal, so a bare backslash or quote
          # would make it unparseable and fail the send. Backslashes first, or the escapes
          # added for the quotes would themselves get escaped.
          subject="${subject//\\/\\\\}"
          subject="${subject//\"/\\\"}"

          header="GitHub Workflow <${RUN_HTML_URL}|${RUN_NAME} ${RUN_NUMBER}> failed:"
          context="*Branch:* <${TREE_URL}/${HEAD_BRANCH}|${HEAD_BRANCH}>\n*Commit:* <${COMMIT_URL_BASE}/${HEAD_SHA}|${HEAD_SHA:0:8} ${subject}>"

          # Delimiter form, because a newline in the value would otherwise let it declare
          # further variables for every later step in the job.
          {
            echo "SLACK_MESSAGE_HEADER<<__GH_HEADER_EOF__"
            printf '%s\n' "$header"
            echo "__GH_HEADER_EOF__"
            echo "SLACK_MESSAGE_CONTEXT<<__GH_CONTEXT_EOF__"
            printf '%s\n' "$context"
            echo "__GH_CONTEXT_EOF__"
          } >> "$GITHUB_ENV"

          body=$(jq -r '(.jobs[] | select(.conclusion == "failure") | {job: .name, step: (.steps[] | select(.conclusion == "failure").name), url: .html_url}) | "• <" + (.url) + "|" + (.job) + " / " + (.step) +  ">"' <<<"$jobs" \
            | sed -e 's/"/\\"/g' | sed -e '$ ! s/$/\\n/' | tr -d '\n')
          echo "SLACK_MESSAGE_BODY=$body" >> "$GITHUB_ENV"

      - name: Send to Slack
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL }}
          payload: |
            {
                "blocks": [
                    {
                        "type": "section",
                        "text": {
                            "type": "mrkdwn",
                            "text": "${{ env.SLACK_MESSAGE_HEADER }}"
                        }
                    },
                    {
                        "type": "section",
                        "text": {
                            "type": "mrkdwn",
                            "text": "${{ env.SLACK_MESSAGE_BODY }}"
                        }
                    },
                    {
                        "type": "context",
                        "elements": [
                            {
                                "type": "mrkdwn",
                                "text": "${{ env.SLACK_MESSAGE_CONTEXT }}"
                            }
                        ]
                    }
                ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACKBOT_TOKEN }}
