name: Grok Connect
on:
  workflow_dispatch: { }
  push:
    branches:
      - master
      - 'release/**'
    paths:
      - 'connectors/**'
  pull_request:
    paths:
      - 'connectors/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  common-check:
    name: Common checks
    uses: ./.github/workflows/common_check.yaml
    with:
      run_trigger: ${{ github.event_name }}

  build:
    name: Build maven
    needs: common-check
    # Standard public runners are 4-core/16GB — enough for the maven build+tests, and
    # free (larger runners are billed even on public repos). Revert to ubuntu-latest-m
    # if the connector test suite starts OOMing.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    if: needs.common-check.outputs.continue == 'true'
    permissions:
      checks: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Set TimeZone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Europe/Kyiv"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ./connectors
      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'adopt'
          # cache: maven
      - name: Build with Maven
        working-directory: ./connectors
        run: mvn --batch-mode -DskipTests package
      - name: Test
        working-directory: ./connectors
        run: mvn -Dmaven.test.failure.ignore=true test
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Maven Tests
          path: /home/runner/work/public/public/connectors/grok_connect/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
      - name: Get version
        id: get_version
        working-directory: ./connectors
        run: |
          current_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${current_version}" >> $GITHUB_OUTPUT

  docker:
    name: Build Docker (${{ matrix.flavor }})
    needs: [ build, common-check ]
    runs-on: ubuntu-22.04
    if: needs.common-check.outputs.continue == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: main
            repo: grok_connect
            providers: ""
          - flavor: extended
            repo: grok_connect_extended
            providers: "Neptune,Impala"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ./connectors
            ./.github
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check published image
        id: check
        run: |
          version="${{ needs.build.outputs.version }}"
          token=$(curl -sSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:datagrok/${{ matrix.repo }}:pull" | jq --raw-output .token)
          image_status=$(curl -LIs -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${token}" "https://registry.hub.docker.com/v2/datagrok/${{ matrix.repo }}/manifests/${version}")
          echo "${image_status}"
          # 404 = tag missing; 401 = the repo itself does not exist yet (first release of a new repo)
          if [[ "${image_status}" == "404" || "${image_status}" == "401" ]] ; then
            echo "image_exists=false" >> $GITHUB_OUTPUT
          else
            echo "image_exists=true" >> $GITHUB_OUTPUT
          fi
          latest_pushed=$(curl --retry 5 -LsS "https://registry.hub.docker.com/v2/repositories/datagrok/${{ matrix.repo }}/tags?page_size=20" | jq -r '[.results[]? | select(.name | test("[0-9]+\\.[0-9]+\\.[0-9]+"))] | sort_by(.tag_last_pushed) | reverse[0].name // "0.0.0"')
          newest_version=$(echo -e "$latest_pushed\n$version" | sort -V | tail -n1)
          if [[ "${newest_version}" == "${version}" ]] ; then
            echo "latest=true" >> $GITHUB_OUTPUT
          else
            echo "latest=false" >> $GITHUB_OUTPUT
          fi
      - name: Set buildx parameters
        id: param
        run: |
          commit_sha=$(echo ${{ github.sha }} | cut -c1-8)
          branch=$(echo ${GITHUB_REF#refs/heads/})
          echo "commit_sha=${commit_sha}" >> $GITHUB_OUTPUT
          echo "branch=${branch}" >> $GITHUB_OUTPUT
          if [[ ${{ steps.check.outputs.image_exists }} == 'true' ]]; then
            platform='linux/amd64'
            echo "platform=${platform}" >> $GITHUB_OUTPUT
            tar="${{ matrix.repo }}_${{ needs.build.outputs.version }}-$(echo ${platform#linux/})-${commit_sha}-${{ github.run_id }}-${{ github.run_attempt }}.tar"
            echo "tar=${tar}" >> $GITHUB_OUTPUT
            echo "dest=type=docker,dest=/tmp/${tar}" >> $GITHUB_OUTPUT

            echo "tags=datagrok/${{ matrix.repo }}:${{ needs.build.outputs.version }}-${commit_sha}" >> $GITHUB_OUTPUT
          else
            echo "platform=linux/amd64" >> $GITHUB_OUTPUT
            if [[ ${{ steps.check.outputs.latest }} == 'true' ]]; then
              echo "cache_to=type=registry,ref=datagrok/${{ matrix.repo }}:cache,mode=max" >> $GITHUB_OUTPUT
              echo "tags=datagrok/${{ matrix.repo }}:latest,datagrok/${{ matrix.repo }}:${{ needs.build.outputs.version }}" >> $GITHUB_OUTPUT
            else
              echo "tags=datagrok/${{ matrix.repo }}:${{ needs.build.outputs.version }}" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: hadolint/hadolint-action@v2.0.0
        with:
          dockerfile: ./connectors/Dockerfile
          failure-threshold: error

      - name: Build and push
        uses: docker/build-push-action@v3
        id: build-push
        with:
          context: ./connectors
          platforms: ${{ steps.param.outputs.platform }}
          push: ${{ (steps.check.outputs.image_exists == 'false') && (github.ref == 'refs/heads/master' || startsWith(github.ref,'refs/heads/release/') == true) }}
          tags: ${{ steps.param.outputs.tags }}
          cache-from: type=registry,ref=datagrok/${{ matrix.repo }}:cache
          cache-to: ${{ steps.param.outputs.cache_to }}
          outputs: ${{ steps.param.outputs.dest }}
          build-args: |
            BRANCH=${{ steps.param.outputs.branch }}
            COMMIT_PUBLIC=${{ github.sha }}
            FLAVOR=${{ matrix.flavor }}
            GROK_CONNECT_PROVIDERS=${{ matrix.providers }}
          labels: |
            BRANCH=${{ steps.param.outputs.branch }}
            COMMIT_PUBLIC=${{ github.sha }}

      - name: Build and push bleeding-edge
        if: github.ref == 'refs/heads/master'
        id: bleeding-edge
        uses: docker/build-push-action@v3
        with:
          context: ./connectors
          platforms: ${{ steps.param.outputs.platform }}
          push: true
          tags: "datagrok/${{ matrix.repo }}:bleeding-edge"
          cache-from: type=registry,ref=datagrok/${{ matrix.repo }}:cache
          cache-to: ${{ steps.param.outputs.cache_to }}
          build-args: |
            BRANCH=${{ steps.param.outputs.branch }}
            COMMIT_PUBLIC=${{ github.sha }}
            FLAVOR=${{ matrix.flavor }}
            GROK_CONNECT_PROVIDERS=${{ matrix.providers }}
          labels: |
            BRANCH=${{ steps.param.outputs.branch }}
            COMMIT_PUBLIC=${{ github.sha }}

      - name: Upload Artifact
        if: steps.param.outputs.tar != '' && github.ref != 'refs/heads/master' && startsWith(github.ref,'refs/heads/release/') != true
        id: docker-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.param.outputs.tar }}
          path: /tmp/${{ steps.param.outputs.tar }}
          retention-days: 7

      - name: Get actors slack
        id: actor
        uses: ./.github/actions/slack-user-action
        with:
          slack-token: ${{ secrets.SLACKBOT_TOKEN }}
          email-mapping: ${{ secrets.EMAIL_SLACK_ID }}
      - name: Get owners slack
        id: owner
        uses: ./.github/actions/slack-user-action
        with:
          slack-token: ${{ secrets.SLACKBOT_TOKEN }}
          emails: "ppolovyi@datagrok.ai"
      - name: Prepare Slack Message
        id: slack-prepare
        if: steps.docker-artifact.outcome == 'skipped' && (steps.build-push.outcome == 'success' || steps.bleeding-edge.outcome == 'success')
        shell: bash
        run: |
          if [[ "${{ steps.bleeding-edge.outcome == 'success' }}" == "true" ]]; then
            header="*${{ matrix.repo }}* Docker Image version *bleeding-edge* is published to Docker Hub"
            echo SLACK_CHANNEL=${{ steps.actor.outputs.user-ids }} >> $GITHUB_ENV
          else
            mentions=$(echo -e "${{ steps.actor.outputs.user-ids }}\n${{ steps.owner.outputs.user-ids }}" | sort -u)
            header="*${{ matrix.repo }}* Docker Image version *${{ needs.build.outputs.version }}* is published to Docker Hub.\n$(for value in $mentions; do echo -n "<@$value> "; done) FYI"
            echo SLACK_CHANNEL='#build' >> $GITHUB_ENV
          fi

          echo "SLACK_MESSAGE_HEADER=$header" >> $GITHUB_ENV
      - name: Send to Slack
        id: slack
        if: steps.slack-prepare.outcome == 'success'
        uses: ./.github/actions/slack-post-action
        with:
          channel: ${{ env.SLACK_CHANNEL }}
          slack-token: ${{ secrets.SLACKBOT_TOKEN }}
          message: ${{ env.SLACK_MESSAGE_HEADER }}
