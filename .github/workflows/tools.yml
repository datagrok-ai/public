name: Tools Package
on:
  workflow_dispatch: { }
  push:
    branches:
      - master
      - 'release/**'
    paths:
      - 'tools/**'
  pull_request:
    paths:
      - 'tools/**'

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_UI: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  common-check:
    name: Common checks
    uses: ./.github/workflows/common_check.yaml
    with:
      run_trigger: ${{ github.event_name }}

  check:
    needs: common-check
    runs-on: ubuntu-22.04
    if: needs.common-check.outputs.continue == 'true'
    name: Check version was changed
    outputs:
      changed_version: ${{ steps.check-version.outputs.changed_version }}
      version: ${{ steps.check-version.outputs.version }}
      job_name: ${{ steps.check-version.outputs.job_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
      - name: Check version was changed
        id: check-version
        working-directory: ./tools
        run: |
          name="$(jq .name package.json | sed 's/"//g')"
          current_version="$(jq .version package.json | sed 's/"//g')"
          npm_version="$(curl --retry 3 -s "https://registry.npmjs.org/${name}/${current_version}" | jq -r '.? | select( has("version") == true ).version')"
          job_name="Build"
          if [[ $npm_version == ${current_version} ]]; then
            changed_version='false'
            echo "Package $name version ${current_version} already published"
            echo "::notice title=${name}::Version ${current_version} is already published"
          else
            if [[ ${{ github.ref }} == 'refs/heads/master' ]]; then
              changed_version='true'
              job_name="Build and publish to NPM"
            else
                echo "It is an actions for development branch. Publish will be skipped"
                echo "::notice title=${name}::It is an actions for development branch. Publish will be skipped"
            fi
          fi
          echo "job_name=${job_name}" >> $GITHUB_OUTPUT
          echo "changed_version=${changed_version}" >> $GITHUB_OUTPUT
          echo "version=${current_version}" >> $GITHUB_OUTPUT

  build:
    name: ${{ needs.check.outputs.job_name || 'Deploy' }}
    needs: [ check, common-check ]
    runs-on: ubuntu-22.04
    if: needs.common-check.outputs.continue == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=datagrok-tools
      - name: Unit tests (grok s, migrate)
        run: pnpm run test:server
        working-directory: ./tools
      # Trusted publishing (OIDC) needs npm >= 11.5.1 on Node >= 22.14. Swap the
      # toolchain only for the publish step so the build keeps its pinned Node.
      - name: Setup Node for trusted publishing
        uses: actions/setup-node@v4
        if: needs.check.outputs.changed_version == 'true'
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for trusted publishing
        if: needs.check.outputs.changed_version == 'true'
        run: npm install -g npm@latest
      - name: npm publish
        id: publish
        if: needs.check.outputs.changed_version == 'true'
        working-directory: ./tools
        run: |
          tgz="$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          for dep in $(tar xzf "$tgz" -O package/package.json | jq -r '(.dependencies // {}) + (.peerDependencies // {}) | to_entries[] | select(.key | test("^(datagrok-api|datagrok-tools|@datagrok-libraries/)")) | "\(.key)@\(.value | ltrimstr("^"))"'); do
            if [ "$(npm view "$dep" version 2>/dev/null)" != "${dep##*@}" ]; then
              echo "::error title=datagrok-tools::depends on $dep, which is not on npm yet; publish it first"
              exit 1
            fi
          done
          npm publish "$tgz"

      - name: Get actors slack
        id: actor
        uses: ./.github/actions/slack-user-action
        with:
          slack-token: ${{ secrets.SLACKBOT_TOKEN }}
          email-mapping: ${{ secrets.EMAIL_SLACK_ID }}
      - name: Get owners slack
        id: owner
        uses: ./.github/actions/slack-user-action
        with:
          slack-token: ${{ secrets.SLACKBOT_TOKEN }}
      - name: Prepare Slack Message
        id: slack-prepare
        if: ${{ steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          mentions=$(echo -e "${{ steps.actor.outputs.user-ids }}\n${{ steps.owner.outputs.user-ids }}" | sort -u)
          header="*datagrok-tools* version *${{ needs.check.outputs.version }}* published to <https://www.npmjs.com/package/$(jq -r .name tools/package.json)/v/${{ needs.check.outputs.version }}|NPM>\n$(for value in $mentions; do echo -n "<@$value> "; done) FYI"
          echo "SLACK_MESSAGE_HEADER=$header" >> $GITHUB_ENV
      - name: Send to Slack
        id: slack
        if: steps.slack-prepare.outcome == 'success'
        uses: ./.github/actions/slack-post-action
        with:
          channel: '#build'
          slack-token: ${{ secrets.SLACKBOT_TOKEN }}
          message: ${{ env.SLACK_MESSAGE_HEADER }}

