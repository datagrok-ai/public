Debug.gif:
  actions:
    - Open the Debug tab for a saved query
    - Fill in and confirm the query input parameter
    - Run the query and watch client/server debug log lines stream in
    - View the resulting dataframe alongside the logs
    - View the process summary table grouped by component
    - Access download logs and clear logs options
  caption: Debugging a query execution
  described_blob: 39df7451ff08a99043caad8369f4e2ceb2bd23f9
  described_by: claude-sonnet-5
  description: >-
    The animation shows the Query Editor's Debug tab for a parameterized query named "stores in
    @state". After opening the query and entering a state parameter, the debug panel streams client
    and server log lines (call duration, gzip compression, dataframe conversion, credential receive)
    alongside the query's result grid of Starbucks store records. It ends with a summary table of
    process steps by component and options to download or clear the logs.
  height: 1000
  illustrates:
    - access/databases
  kind: animation
  quality: docs
  quality_notes: Debug log text is mostly cut off/truncated in the narrow panel and not fully readable
  reviewed: true
  seconds: 30.4
  width: 1600
