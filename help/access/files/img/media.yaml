  described_blob: 2864dcee099902766d6be61f8e4e9d82b87e4a18
  described_by: claude-sonnet-5
  description: >-
    The Files view shows a folder tree on the left with entries like a CIF structure, an SDF
    molecule, image, CSV, and HTML files, and a preview pane on the right that updates as each file
    is selected. Selecting a CIF file previews a 3D ribbon structure of a protein with bound
    ligands; selecting an SDF file previews a 3D ball-and-stick molecule; selecting CSV files
