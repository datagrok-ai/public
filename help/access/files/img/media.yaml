Cell-image-segmentation.gif:
  actions:
    - select an image file in the Demo Files/images/cells folder
    - view the augmented preview with segmented cell outlines and count in the context panel
    - >-
      click through additional cell images (cells2.jpg, cells3.jpg) to see the overlay and count
      update
  caption: Cell image segmentation info panel
  described_blob: 85dec2aa6111bd64b6b1dd039be1f12c7bbea553
  described_by: claude-sonnet-5
  description: >-
    The Files browser shows a folder of cell microscopy images (cells1–cells5) with a preview panel
    on the right. Selecting an image opens a custom 'Cell Imaging Segmentation' info panel that
    overlays detected cell boundaries in magenta and reports a cell count next to the image name. As
    the user clicks through different cell images, the panel updates its segmentation overlay and
    count accordingly.
  height: 1000
  kind: animation
  quality: docs
  quality_notes: >-
    small UI text and busy multi-panel layout make it hard to read standalone without surrounding
    context
  reviewed: false
  seconds: 39.3
