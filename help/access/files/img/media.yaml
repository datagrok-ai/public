add-a-file-share.gif:
  actions:
    - Open Actions panel
    - Click New file share
    - Choose S3 as the data source
    - Enter Name, Region, and Bucket
    - Toggle Anonymous access
    - Switch to Credentials owner and enter Access Key and Secret Key
    - Confirm with OK
    - New share appears in the file tree
  caption: Adding a file share connection
  described_blob: f8d80943a95facb00ceef4aa3b261bb5315f1508
  described_by: claude-sonnet-5
  description: >-
    In the Files view, the user opens the Actions panel and clicks "New file share", which opens the
    New file share dialog. They select S3 as the data source and fill in the name (ORBIT), region,
    and bucket, first toggling Anonymous access on, then switching to a Credentials owner with an
    access key and secret key. After clicking OK, the new ORBIT share appears in the file tree
    alongside Home, App Data, Demo Files and Physionet.
  height: 500
  illustrates:
    - govern/access-control
  kind: animation
  quality: answer
  reviewed: false
  seconds: 33.9
  width: 800
clinical-case-file-manager.gif:
  actions:
    - browse to a folder in App Data
    - view the custom preview widget suggesting an application for the folder's file types
    - click the "Run ClinicalCase" link
    - the ClinicalCase application opens with a summary dashboard
  caption: Launching a file-type-based application from the Files browser
  described_blob: 6e9269a3250ac87711e6ea719cb6f4610a4b3198
  described_by: claude-sonnet-5
  description: >-
    The Files app shows a folder of clinical data files (ClinicalCase, containing SDTM CSVs like
    ae.csv, dm.csv, lb.csv). The context panel preview recognizes the folder's content type and
    displays a custom widget with a "Run ClinicalCase" link instead of a generic file preview.
    Clicking the link launches the ClinicalCase application, which opens a dashboard summarizing the
    CDISCPILOT01 study with enrollment, demographics, and error charts.
  height: 500
  illustrates:
    - govern/access-control
  kind: animation
  quality: docs
  quality_notes: >-
    small viewport crops long labels (e.g. race categories) and the file tree is cluttered with
    unrelated folders, but the widget and resulting app are clearly readable
  reviewed: false
  seconds: 12.4
  width: 800
file-manager-details.gif:
  actions:
    - expand Details on a numeric column
    - expand Stats to view summary statistics
    - select the canonical_smiles column and view its Details/categories
    - expand the Chem section and its structure options
    - resize the Context Panel
  caption: Exploring the Context Panel's Details tab
  described_blob: 718580d2b06172966eebe3fb651e24b7798c790d
  described_by: claude-sonnet-5
  description: >-
    A file browser shows a selected CSV of chemical structures with a Context Panel on the right.
    The animation walks through the Details section, then Stats (showing count, unique, min/max,
    sum, median for a numeric column), then Details for a SMILES column (showing category
    breakdown), then the Chem section with structure-rendering options like scaffold column and
    highlight-from-column, and finally resizes the panel to reveal a new grid column.
  height: 500
