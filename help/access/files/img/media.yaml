add-a-file-share.gif:
  actions:
    - open Actions menu
    - click New file share
    - select S3 as Data Source
    - enter Name, Region, and Bucket
    - toggle Anonymous checkbox
    - switch Credentials owner to All users and enter Access Key/Secret Key
    - confirm to create the share, which appears in the file tree
  caption: Adding a new file share
  described_blob: f8d80943a95facb00ceef4aa3b261bb5315f1508
  described_by: claude-sonnet-5
  description: >-
    In the Files view, the user opens the Actions menu and clicks "New file share" to open the New
    file share dialog. They switch the Data Source from Dropbox to S3, then fill in the connection
    parameters: Name (ORBIT), Region (us-east-2), Bucket (datagrok-orbit), toggling Anonymous
    access, and switching Credentials owner to "All users" with an Access Key and Secret Key. After
    clicking OK, the new "ORBIT" share appears in the Files tree alongside Home, App Data, Demo
    Files, and Physionet.
  height: 500
  illustrates:
    - access/files
    - access/files/shares
  kind: animation
  quality: answer
  reviewed: true
  seconds: 33.9
  width: 800
clinical-case-file-manager.gif:
  actions:
    - open the ClinicalCase folder in App Data
    - view the auto-generated Preview widget suggesting a matching application
    - click the "Run ClinicalCase" link
    - view the resulting clinical study summary dashboard
  caption: Preview widget for a clinical-data file folder
  described_blob: 6e9269a3250ac87711e6ea719cb6f4610a4b3198
  described_by: claude-sonnet-5
  description: >-
    The animation navigates the Files app into an App Data folder named ClinicalCase, which contains
    SDTM clinical trial CSV files (ae.csv, dm.csv, lb.csv, sv.csv, tv.csv). The Preview panel
    detects the file types and shows a custom widget stating the folder contains SDTM data for Study
    ID CDISCPILOT01, with a "Run ClinicalCase" link. Clicking that link launches an application that
    renders a study summary dashboard with enrollment charts, subject demographics, and error
    counts.
  height: 500
  illustrates:
    - access/files
  kind: animation
  quality: docs
  quality_notes: small UI text (labels, axis ticks) is not legible at this resolution
  reviewed: true
  seconds: 12.4
  width: 800
file-manager-details.gif:
  actions:
    - select the canonical_smiles column
    - expand Details/Stats for the column
    - expand the Chem section and toggle Show structures/scaffold options
    - drag the panel divider to resize the preview area
  caption: Details on demand in the Context Panel
  described_blob: 718580d2b06172966eebe3fb651e24b7798c790d
  described_by: claude-sonnet-5
  description: >-
    The Files view shows smiles.csv open with a grid of molecule structures and a Context Panel on
    the right. The animation clicks through the panel's Details section for the file itself, then
    for the selected canonical_smiles column, revealing stats (categories, units, data type,
    semantic type) and a Chem section with scaffold and structure-rendering options. It ends by
    dragging the panel divider to resize it and reveal the NumSaturate column underneath.
  height: 500
  illustrates:
    - access/files
  kind: animation
  quality: docs
  quality_notes: >-
    long, low-signal animation (639 frames) whose sampled frames show generic panel exploration
    rather than a focused single task; fine for the files.md context but not self-explanatory enough
    to stand alone
  reviewed: true
  seconds: 60.7
  width: 800
file-manager-file-browsing.gif:
  actions:
    - Select a .cif file to preview its 3D molecular structure
    - Select a .sdf file to preview its 3D molecule
    - Select a fruits.csv file to preview its table with image thumbnails
    - Select a smiles.csv file to preview its table of chemical structures
    - Open a column summary popup on the smiles.csv structure column
    - Select an .html file to preview its source code
