file-manager-file-browsing.gif:
  actions:
    - click 3onz.cif to preview a 3D protein structure
    - click aspirin-3d.sdf to preview a 3D molecule
    - click fruits.csv to preview a table with embedded images
    - click smiles.csv to preview a table with rendered chemical structures
    - hover a cell to show a tooltip with more structures
    - click tennis_players.html to preview its HTML/code content
  caption: Browsing and previewing files
  described_blob: 2864dcee099902766d6be61f8e4e9d82b87e4a18
  described_by: claude-sonnet-5
  description: >-
    The Files view shows a folder of sample files (a CIF structure, an SDF molecule, a JPEG, CSV
    tables, an HTML file, a ZIP) in a tree on the left and a live preview pane on the right.
    Selecting different files updates the preview: a protein structure renders in 3D, a small
    molecule renders in 3D, a CSV with an image column shows fruit photos inline, another CSV
    renders chemical structures from SMILES, and an HTML file shows its source in a text/code
    preview. A details panel on the right lists file metadata such as size and modification date.
  height: 500
  kind: animation
  quality: answer
  reviewed: false
  seconds: 60.2
  width: 800
