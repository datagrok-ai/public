  width: 26
funnel.png:
  caption: Funnel icon for filters
  described_blob: e6a57b7bfd2f2b413ff52ef4661730bb58e5c2a9
  described_by: claude-sonnet-5
  description: >-
    A small funnel-shaped icon used as a toolbar button. Clicking it toggles the Filters panel in
    the Table View, either from the Toolbox or from the top of the Table View itself.
  height: 28
  illustrates:
    - visualize/viewers/filters
  kind: icon
  quality: docs
  quality_notes: Tiny (25x28) UI glyph, only meaningful as an inline icon reference, not as a standalone image
  reviewed: true
  width: 25
gear-icon.png:
  caption: Gear icon for viewer settings
  described_blob: e7f1e0538345ccbda61a050440c4b49420b4226d
  described_by: claude-sonnet-5
  description: >-
    A small circular gear icon used inline in the documentation to mark the settings control on a
    viewer's toolbar. Clicking this icon opens the viewer's settings in the Context Panel, where
    users can adjust properties like Row Source, On Click actions, and other appearance or data
    options.
  height: 25
  illustrates:
    - visualize/viewers
  kind: icon
  quality: docs
  quality_notes: Tiny UI icon (28x25px) with no standalone informational value outside inline text references.
  reviewed: true
  width: 28
hamburger-menu.png:
  caption: Hamburger menu icon
  described_blob: c8398d1d3e40d732c5605a95348cd8c26d656296
  described_by: claude-sonnet-5
  description: >-
    A small square icon showing three horizontal lines stacked vertically, the standard hamburger
    menu glyph. It appears throughout the docs next to instructions to open a context menu on a
    column header, viewer header, or panel toolbar.
  height: 20
  illustrates:
    - visualize/viewers
    - visualize/viewers/filters
  kind: icon
  quality: docs
  quality_notes: >-
    Tiny inline UI glyph (20x20), meaningful only as an icon reference inside surrounding text, not
    as a standalone visual.
  reviewed: true
  width: 20
remove-column.png:
