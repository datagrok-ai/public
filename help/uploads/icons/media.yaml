add-viewer-icon-temp.png:
  caption: Add viewer icon
  described_blob: bfbfba9f3d88fbdde6a52d368c1e2eef65ee60e3
  described_by: claude-sonnet-5
  description: >-
    A small circular icon, a stylized plus-in-circle symbol used as the toolbar button for adding a
    viewer to a table view. It is a tiny 24x25 pixel image with a low-resolution, placeholder look,
    matching its 'temp' file name.
  height: 25
  illustrates:
    - visualize/viewers
  kind: icon
  quality: unfit
  quality_notes: >-
    Blurry, low-resolution placeholder icon (file name and small pixel dimensions confirm it is a
    temporary asset, not a finished UI icon); unusable on its own or blown up in docs.
  reviewed: true
  width: 24
download-icon.png:
  caption: Download icon
  described_blob: 7ad2e09e35fc8bc9c707558de1699f673fc91529
  described_by: claude-sonnet-5
  description: >-
    A small down-arrow icon used inline in the Basic tasks documentation to mark the Download
    command. It represents the icon shown at the top of the screen for downloading an open table as
    a file or set of files.
  height: 33
  kind: icon
  quality: docs
  quality_notes: >-
    Tiny inline UI icon, not meant to stand alone; too small and generic to answer a question by
