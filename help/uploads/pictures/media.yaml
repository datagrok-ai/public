dendrogram-close-button.png:
  caption: Closing the dendrogram viewer
  described_blob: 26efd33482d62d6e76aaf583b26da2c743e46cc0
  described_by: claude-sonnet-5
  description: >-
    A grid of peptide sequences is shown with a hierarchical clustering dendrogram injected as an
    extra column on the left, its branches colored orange and green for related clusters. A red
    arrow points to an X button in the top-right corner of the tree view, which closes the
    dendrogram and restores the original grid.
  height: 976
  kind: screenshot
  quality: docs
  quality_notes: >-
    annotated with a red arrow, cropped mid-table, useful in context but not a clean standalone
    answer
  reviewed: true
  width: 2034
