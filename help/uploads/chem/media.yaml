drug-likeness-panel.png:
  caption: Drug likeness sub-structure fragments
  described_blob: 615ca025b2af6dac6db8814d8313f8154fe188aa
  described_by: claude-sonnet-5
  description: >-
    The Drug Likeness info panel shows a score of -1.06 for the selected molecule, alongside a list
    of found sub-structure fragments and their individual contributions to the score. Each fragment
    is drawn as a small ring diagram with yellow atoms marking positions that carry at least one
    more substituent, paired with its numeric contribution value.
  height: 596
  kind: screenshot
  quality: docs
  quality_notes: small ring-fragment diagrams and their yellow-atom annotation are hard to read at this size
  reviewed: true
  width: 473
gasteiger-charges.png:
  caption: Visualizing Gasteiger partial charges on a molecule
  described_blob: 2fd4cd50638713491469e51025a97814d5da5b38
  described_by: claude-sonnet-5
  description: >-
    A dialog titled 'Gasteiger Partial Charges' shows a molecule input field and a 'Contours'
    parameter set to 10. Below it, the rendered molecule structure is overlaid with colored contour
    clouds around nitrogen and oxygen atoms, indicating regions of positive (blue) and negative
    (red/purple) partial charge computed by the Gasteiger method.
  height: 480
  kind: screenshot
  quality: docs
  quality_notes: >-
    plain functional UI screenshot, small dialog crop plus structure render, not polished for
    standalone use
  reviewed: true
  width: 800
murcko-scaffolds.png:
  caption: Murcko scaffold results table
  described_blob: 5d9297298602745a421cdc3eba46f3b5c743cadc
  described_by: claude-sonnet-5
  description: >-
    A results grid shows molecule structures alongside computed columns logP, logS, and
    acceptorCount, with a final scaffolds column showing the Murcko scaffold extracted from each
    molecule. Rows include a phenyl scaffold, a naphthyridine-like fused bicyclic scaffold, and a
    pyridine ring scaffold, illustrating how the function reduces varied molecules to their core
    ring systems.
  height: 619
  kind: screenshot
  quality: docs
  quality_notes: >-
    cropped mid-table with no header row numbering context or column headers fully explained;
    functional but plain grid view
  reviewed: true
  width: 662
r-group-analysis.png:
  caption: Setting up R-Group Analysis on a molecule set
  described_blob: 72ee07ac3f1d7a27ba152682e206e4a540f6ad3c
  described_by: claude-sonnet-5
  description: >-
    A trellis plot breaks out a chemical structure dataset by two R-group substituents, R1 on the X
    axis and R2 on the Y axis, with each cell showing a pie-chart summary and the structural
    fragments (R3 variants) listed along the rows. An R-Group Analysis dialog is open on top,
    showing a core scaffold with attachment points, an MCS option, and a configurable column prefix
    before running the decomposition.
  height: 973
  illustrates:
    - visualize/viewers/trellis-plot
  kind: screenshot
  quality: docs
  quality_notes: >-
    small text and dense pie-chart grid make it hard to read at a glance; useful in context but not
    self-explanatory alone
  reviewed: true
  width: 748
reactions.png:
  caption: Two Component Reaction dialog
  described_blob: 178c697a1bec7df918bb5a9182bb9f388396fa06
  described_by: claude-sonnet-5
  description: >-
    A Datagrok table with reactants1 and reactants2 columns of molecule structures is open behind
    the Two Component Reaction dialog. The dialog lets the user pick the data table and reactant
    columns for each reactant set, enter a reaction template in SMARTS format, and toggle Matrix
    Expansion and Randomize options. Below the dialog, a result grid shows the product molecules
    generated for each reactant1/reactant2 pair.
  height: 1035
  illustrates:
    - domains/chem
  kind: screenshot
  quality: docs
  quality_notes: small dialog text and dense molecule grid are hard to read at this resolution
  reviewed: true
  width: 1079
