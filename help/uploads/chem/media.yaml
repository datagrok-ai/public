tsne.png:
  caption: Chemical space using tSNE
  described_blob: ba65259e36929b699dd381c0a71bb06f5a01b48c
  described_by: claude-sonnet-5
  description: >-
    A four-panel dashboard analyzes a set of molecules. Top left shows a grid of molecular
    structures with SMILES, ID, and molecular weight columns, with one row selected and highlighted.
    Top right and bottom right show a SpanningTree and a LinkageTree (dendrogram) colored by
    distance. Bottom left shows the ChemSpace scatter plot, produced with tSNE, where molecules are
    grouped into colored clusters based on chemical similarity.
  height: 670
  kind: screenshot
  quality: docs
  quality_notes: small text and cramped four-panel layout make individual chart labels hard to read at a glance
  reviewed: true
  width: 800
umap.png:
