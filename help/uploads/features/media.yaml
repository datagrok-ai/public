login-signup.png:
  caption: User authentication process UML diagram
  described_blob: 577cc992e49dd838f23a2de07ff893d5aa035c86
  described_by: claude-sonnet-5
  description: >-
    A UML activity diagram spanning Web UI, Datlas, permanent storage, and OAuth swimlanes, showing
    the full authentication flow: signup, OAuth login, password login, email confirmation, and
    invites. It traces decision points such as whether a user exists, is blocked, has a unique
    login, domain-allowed signup, and email confirmation state, down to database actions like
    creating a user, storing sessions, and sending confirmation codes.
  height: 1422
  illustrates:
    - govern/access-control/authentication
    - govern/access-control
  kind: diagram
  quality: docs
  quality_notes: >-
    dense flowchart with small text, not readable at a glance without zooming; useful as a technical
    reference alongside the page but not standalone
  reviewed: true
  width: 5602
open-api-weather-map-connection.png:
  caption: Webservices Manager tree for an imported connection
  described_blob: 7544477c830d15b1f1e33f197cc57344ce738e10
  described_by: claude-sonnet-5
  description: >-
    The Webservices Manager panel shows an OpenWeatherMap connection expanded in a tree view,
    listing its auto-generated queries such as "5 day/3 hour Forecast By City Name," "Current
    Weather Data By City Name," and several UV-index and geographic-coordinate queries. Each query
    is prefixed with a function icon, illustrating how importing a Swagger file creates a connection
    with its associated queries ready to browse.
  height: 222
  kind: screenshot
  quality: docs
  quality_notes: small, tightly cropped tree view with no surrounding chrome for context
  reviewed: true
  width: 612
open-api-weathermap-query.png:
  caption: Context panel for an OpenWeatherMap query
  described_blob: 3b6c028da95764165f92fe2c103be9e8e3f90997
  described_by: claude-sonnet-5
  description: >-
    The context panel shows a 'Cities In Cycle' query from the OpenWeatherMap connection, with its
    description, metadata (creator, dates, params), and a Run section with parameter inputs for Lat,
    Lon, and Cnt plus a Run button. Below that are collapsible Query and Transformations sections
    and a Usage section showing successful run count, average time, and first/last call timestamps.
  height: 912
  kind: screenshot
  quality: docs
  quality_notes: cropped to just the panel, no surrounding app chrome for orientation
  reviewed: true
  width: 465
open-api-weathermap-results.png:
  caption: Query results in an interactive grid
  described_blob: 1463b2b445baff2875903204eadb416c57eca951
  described_by: claude-sonnet-5
  description: >-
    A Datagrok grid displays results from an OpenWeatherMap query, with columns for id, name,
    coordinates, temperature, feels-like, min/max temperature, pressure, and humidity. Rows list
    towns and villages (Petrila, Jitani, Petrosani, and others) with their weather readings. The
    first row is selected, highlighted in green.
  height: 605
  kind: screenshot
  quality: docs
  quality_notes: >-
    Cropped to just the grid with no surrounding chrome, so it reads as a generic data table rather
    than showing the webservice query workflow it illustrates.
  reviewed: true
  width: 2395
recipe-editor.png:
  caption: Building a data transformation pipeline in the job editor
  described_blob: 586e8ab5cbae4b24df9b08c70c0c443ea07bce9e
  described_by: claude-sonnet-5
  description: >-
    A job editor canvas showing connected steps: a Datlas Health Summary source and a Jira JQL
    Search feed into KeepColumns and JoinTables, whose outputs run to two PublishTable steps and a
    Save health log step. Arrows connect each step's output triangle to the next step's input,
    illustrating how functions are chained by drawing connections between them.
  height: 572
  kind: screenshot
  quality: docs
  quality_notes: >-
    clear diagram but a specific, domain-tied example (health summary/Jira) rather than a generic
    illustration
  reviewed: true
  width: 716
