pls-expl-vars.png:
  caption: PLS explained variance by component
  described_blob: 763cde567ea0612fa505ebdeaa19f88d1fd551eb
  described_by: claude-sonnet-5
  description: >-
    A horizontal bar chart titled "Explained Variance" compares cumulative variance explained by 1,
    2, and 3 PLS components: 0.70, 0.82, and 0.92 respectively, on a 0-to-0.92 axis. Below the chart
    are dropdown-style labels "avg" and "price", indicating the aggregation and target column used.
  height: 250
  illustrates:
    - explore/multivariate-analysis
  kind: screenshot
  quality: docs
  quality_notes: small, cropped chart-only capture with no surrounding UI chrome for context
  reviewed: true
  width: 400
pls-formula.gif:
  actions:
    - hover over the wheel base bar in the Regression Coefficients chart to see its coefficient
    - hover over the price (predicted) column header
    - expand the tooltip to reveal the full model formula with all coefficients
  caption: Viewing the PLS regression model formula
  described_blob: 8445cc60a785b8138c538136aa85edd344b48134
  described_by: claude-sonnet-5
  description: >-
    A multivariate analysis PLS view shows Regression Coefficients, Scores, Loadings, and Explained
    Variance panels alongside a car dataset grid. Hovering over the "price (predicted)" column
    header first shows a small coefficient tooltip for one feature, then a fuller tooltip listing
    the model's regression coefficients, and finally expands into a full formula tooltip showing the
    predicted price as a sum of each feature multiplied by its coefficient plus a bias term.
  height: 1001
  illustrates:
    - explore/multivariate-analysis
  kind: animation
  quality: docs
  quality_notes: >-
    small text in the formula tooltip is hard to read at full frame size, and the cursor position
    makes the flow slightly unclear
  reviewed: true
  seconds: 4.1
  width: 1601
pls-loadings.png:
  caption: Reading a PLS loadings scatterplot
  described_blob: b0be279ce8391943849131c91249bb7c69c467df
  described_by: claude-sonnet-5
  description: >-
    A scatterplot titled "Loadings" plots car features by their two PLS loading coordinates
    (x.loading.p1 and x.loading.p2). Points like horsepower, eng.size, curb.weight, and wheel.base
    sit far from the origin toward the right, while symbol, num.doors, and hatchback cluster
    together in the upper left, and highway.mpg and city.mpg sit far left. A highlighted point marks
    hatchback, and a horizontal reference line runs along the bottom of the plot.
  height: 500
  illustrates:
    - explore/multivariate-analysis
  kind: screenshot
  quality: docs
  quality_notes: some point labels overlap and are hard to read (symbol/num.doors/wheel.base cluster)
  reviewed: true
  width: 800
pls-model-n-scores.gif:
  actions:
    - filter the Observed vs. Predicted plot to a subset of points
    - drag-select a group of points in the Observed vs. Predicted plot
    - observe the matching points highlighted in the linked Scores scatterplot
  caption: Linking Observed vs. Predicted to Scores
  described_blob: ccf2317d028a2483e169e24789298cb5f6498594
  described_by: claude-sonnet-5
  description: >-
    The PLS model view shows an Observed vs. Predicted scatterplot next to a Scores scatterplot,
    along with Loadings, Regression Coefficients, and Explained Variance panels. The user filters
    the Observed vs. Predicted plot down to a few points (jaguar, porsche, mercedes, volvo3), then
    clicks and drags a selection box around the jaguar/porsche pair. The corresponding points
    highlight in orange in both the Observed vs. Predicted plot and the linked Scores scatterplot,
    showing the same cars' positions among the latent factors.
  height: 1001
  illustrates:
    - explore/multivariate-analysis
  kind: animation
  quality: docs
  quality_notes: >-
    small embedded viewer panels with dense labels are legible but busy; not a clean standalone
    marketing shot
  reviewed: true
  seconds: 7.3
  width: 1601
pls-predicted-vs-reference.png:
  caption: PLS Observed vs. Predicted scatterplot
  described_blob: 977e50a37aa67e5b31229ec285f3c849b099593b
  described_by: claude-sonnet-5
  description: >-
    A scatterplot titled 'Observed vs. Predicted' plots actual price against price predicted by a
