pls-regr-coeffs.png:
  caption: Regression coefficients bar chart
  described_blob: 817e399272b1ddee9d97b588b69620c05b595e10
  described_by: claude-sonnet-5
  description: >-
    A horizontal bar chart titled "Regression Coefficients" lists model features on the y-axis
    (diesel, two.doors, symbol, width, eng.size, horsepower, length, wheel.base, curb.weight,
    peak.rpm, highway.mpg, city.mpg, turbo, height, hatchback) with green bars showing each
    feature's coefficient value from a linear model, labeled with its exact number. Diesel has the
    largest positive coefficient (4750.79) and hatchback the largest negative one (-4460.82). A bias
    term of -3460.281 is noted below the chart.
  height: 500
  illustrates:
    - explore/multivariate-analysis
  kind: screenshot
  quality: answer
  reviewed: true
  width: 800
pls-run.gif:
  actions:
    - open the ML menu and choose Analyze > Multivariate Analysis (PLS)
    - configure Predict, Using, and Components fields in the dialog
    - click RUN
    - switch between the Regression Coefficients and Variable Importance tabs to inspect results
  caption: Running multivariate analysis (PLS)
  described_blob: 4d148f6281ba46c8d8e6d6636387f5d98ab5c8df
  described_by: claude-sonnet-5
  description: >-
    In the cars table, the ML menu opens Analyze > Multivariate Analysis (PLS), showing a dialog to
    predict price using a set of features with 3 components. Running it produces a linked set of
    viewers: an Observed vs. Predicted scatterplot with r2, a Scores plot, a Loadings plot, Variable
    Importance and Regression Coefficients bar charts, and an Explained Variance chart comparing 1-3
    components.
  height: 1001
  illustrates:
    - explore/multivariate-analysis
  kind: animation
  quality: answer
  reviewed: true
  seconds: 14
  width: 1601
pls-scores.png:
  caption: PLS scores scatterplot with Hotelling's T² ellipses
  described_blob: 88452f5a2dd9c2c813c081abaf24d351f1008ffc
  described_by: claude-sonnet-5
  description: >-
    A scatterplot titled "Scores" plots PLS component t1 on the x-axis against t2 on the y-axis,
    with each point labeled by a car brand (Toyota, Honda, Volvo, Mercedes, and others). Two
    concentric ellipses centered on the origin mark Hotelling's T² confidence regions: an orange 95%
    ellipse and a larger blue 99% ellipse. Most points fall inside the orange ellipse, while Porsche
    and Jaguar sit near or outside the blue ellipse, standing out as potential outliers; the
    selected point (Alfa Romeo) is highlighted with a black outline.
  height: 500
  illustrates:
    - explore/multivariate-analysis
  kind: screenshot
  quality: answer
  reviewed: true
  width: 800
pls-vip.png:
  caption: PLS variable importance in projection (VIP)
  described_blob: 9f3703a74c771504631937b7a37da70fa59e2b65
  described_by: claude-sonnet-5
  description: >-
    A horizontal bar chart titled "Variable Importance" lists model features on the Y axis
    (eng.size, horsepower, curb.weight, city.mpg, highway.mpg, width, length, wheel.base, diesel,
    hatchback, height, symbol, turbo, peak.rpm, two.doors) ranked from highest to lowest VIP score,
    with each green bar labeled by its numeric score from 1.52 down to 0.47. The chart lets a reader
    see at a glance which features contribute most to the PLS model's explanation of the response
    variable.
  height: 500
  illustrates:
    - explore/multivariate-analysis
  kind: screenshot
  quality: answer
  reviewed: true
  width: 800
pls_vs_pca.png:
  caption: PLS components compared with PCA components
  described_blob: 4ac45b6b248ad1da5fd4c9f672f6f4147c5829fa
  described_by: claude-sonnet-5
  description: >-
    Two side-by-side scatter plots of car price against the first component, one built with PLS and
    one with PCA, each with a fitted regression line and equation. The PLS plot shows a tighter
    linear fit (r2 = 0.701) than the PCA plot (r2 = 0.430), illustrating that PLS captures more of
    the response variable using the same number of components.
  height: 500
  illustrates:
    - explore/multivariate-analysis
  kind: screenshot
  quality: docs
  quality_notes: small data-point labels are hard to read at full size
  reviewed: true
  width: 800
