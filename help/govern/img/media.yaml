    - Type a description in the Summary tab
    - Check the Email checkbox and view its tooltip
    - Open the Timelines tab to view captured events
    - Open the Console tab to view captured log/stack trace
    - Open the Tables tab and check Metadata and Data
    - Hover the Save as JSON icon
