сonfiguring-reporting-system.gif:
  actions:
    - open Toolbox > Settings > Server > Admin
    - expand the Error reporting section
    - hover Auto report errors to reveal its tooltip
    - check the Auto report errors checkbox
    - click Save and apply
  caption: Configuring the error reporting system
  described_blob: 4531f246afca2b5fea1d406c2e8f1073f2904e59
  described_by: claude-sonnet-5
  description: >-
    The Settings panel is open under Admin. The user expands the Error reporting section, which
    shows a Report email field pre-filled with feedback@datagrok.ai, plus Notify assignee, Auto
    report errors, and Secure test reporting checkboxes. A tooltip explains that Auto report errors,
    when enabled, automatically creates a report with extended logs (console, server, data
    connectivity, Docker) and sends it to the server whenever an error occurs. The user checks Auto
    report errors and clicks Save and apply, and the button confirms with a green Saved! label.
