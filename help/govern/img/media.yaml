group-membership.gif:
  actions:
    - Select a group in the Groups panel
    - >-
      Open the group's context menu and choose the option to create an invitation link (with
      password)
    - Copy the generated URL containing the groupPassword parameter
    - Open a new browser tab and paste the URL into the address bar
    - Navigate to the URL, landing on the Datagrok home page
    - Return to the Groups panel and confirm the new member appears in the group's member list
  caption: Sharing a group via invitation link
  described_blob: ddf1e428eaba6192293aaf5e43dfd52d43abcac4
  described_by: claude-sonnet-5
  description: >-
    In the Datagrok Groups admin panel, the user clicks a group named "Test" and opens its Actions
    menu to generate an invitation link with an embedded group password. The browser then navigates
    to a URL of the form public.datagrok.ai/?groupPassword=..., which is meant to be pasted into a
    browser to auto-join the group; the recording shows this being pasted into a new browser tab's
    address bar. After navigating, the recipient lands on the Datagrok home page, and returning to
    the Groups panel shows the new member added to the "Test" group's member list.
  height: 501
  illustrates:
    - govern/access-control
  kind: animation
  quality: docs
  quality_notes: >-
    Small UI text and cursor actions are hard to follow at this resolution, and the middle frames
    show generic browser chrome (Google new-tab page) rather than the Datagrok UI, diluting the
    demonstration.
  reviewed: true
  seconds: 51.9
  width: 800
groups.png:
  caption: Group membership and nested groups
  described_blob: 8df4ad0764cb54453468cc96e213faeaf7163c77
  described_by: claude-sonnet-5
  description: >-
    A block diagram shows Group 1 containing User 1 and Group 2 as direct members, with arrows
    pointing into Group 1. Group 2 in turn contains User 2 and User 3 as its members, with arrows
    pointing into Group 2. This illustrates how nested group membership works: users become indirect
    members of a parent group through their membership in a child group.
  height: 221
  illustrates:
    - govern/access-control
  kind: diagram
  quality: answer
  reviewed: true
  width: 361
