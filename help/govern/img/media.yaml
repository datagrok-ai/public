  described_by: claude-sonnet-5
  description: >-
    The Report an error dialog opens over a data table view, with a Summary tab where the user types
    a description like "Error opening project" and sees an attached screenshot of the current app
    state. Checking Email shows a tooltip explaining the report will be sent to
    feedback@datagrok.ai. The user then switches through the Timelines, Console, and Services tabs,
    which list timestamped UI events, log lines, and stack traces captured for the report. Finally,
    on the Tables tab, they check Metadata and Data checkboxes for a table and hover the Save as
    JSON icon in the corner.
