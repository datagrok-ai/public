connection-credentials-by-group.gif:
  actions:
    - Open Platform > Connections in the Browse tree
    - Search for and select the GitHub connection
    - Open the connection's context menu and choose Credentials...
    - View and select a group row in the Manage credentials dialog
  caption: Managing connection credentials per group
  described_blob: 1cba9d2c49e7a119188f34238a0727ca2a107ccc
  described_by: claude-sonnet-5
  description: >-
    The animation shows a Datagrok Browse panel navigating to Connections, searching for and
    selecting a GitHub connection, then opening its context menu and choosing Credentials. The
    resulting "Manage credentials for GitHub" dialog lists rows for the All users group and
    per-group rows (Administrators, Developers, and a named user), each with fields for security
    type and credential values such as ClientId, ClientSecret, and Token. The Administrators row is
    selected, showing where a group's specific credentials would be entered before clicking OK.
  height: 1001
  illustrates:
    - govern/access-control/credentials
  kind: animation
  quality: answer
  reviewed: true
