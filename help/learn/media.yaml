tip-low_accuracy.png:
  caption: Reading model precision from a confusion matrix
  described_blob: a3dba636b79b4ff1a5c69b9d438d85a5578181ad
  described_by: claude-sonnet-5
  description: >-
    A confusion matrix titled 'Confusions' cross-tabulates actual vs. predicted F/M classes with
    counts and per-row/column accuracy ratios. The cursor hovers over the bottom-left ratio (0.419,
    highlighted in red), triggering a tooltip explaining that precision measures the proportion of
    true positives among all positive predictions, with higher values indicating fewer false
    positives.
  height: 373
  kind: screenshot
  quality: docs
