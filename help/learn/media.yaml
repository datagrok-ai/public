mlflow-tags.png:
  caption: MLFlow model tags for Datagrok integration
  described_blob: dc9c847ffac59efb924bf985bca20a5072e919d9
  described_by: claude-sonnet-5
  description: >-
    The MLFlow Models page shows the registered model "chemprop-test" with its creation and
    modification timestamps. Below, an expanded Tags section lists a table of tag names and values,
    including a bare "datagrok" tag and "datagrok-inputs-0-semtype" set to "Molecule", used to
    configure how Datagrok interprets the model's inputs and outputs.
  height: 497
  kind: screenshot
  quality: docs
  quality_notes: cropped mid-table, only two tag rows visible
  reviewed: true
  width: 1131
predictive-modeling.gif:
  actions:
    - choose table and column to predict
    - select model engine (XGBoost) and set hyperparameters
    - view predicted-vs-actual scatter plot
    - review wrong predictions table
    - name and save the model
    - view predicted column added to the table
  caption: Building a predictive model
  described_blob: 1f2e3147d953ace88d6bee39caac16e68aa245d2
  described_by: claude-sonnet-5
  description: >-
    In the Predictive model dialog, the user picks a table and column to predict (SEX), then selects
    an XGBoost model engine and tunes hyperparameters like iterations, learning rate, max depth, and
    lambda. A scatter plot of predicted vs. actual SEX by height and weight updates, along with a
    wrong-predictions table. The user names and saves the trained model as "predict_sex", which then
    appears as a new predicted column in the data table.
  height: 1000
  kind: animation
  quality: docs
  quality_notes: small UI text and dense tables are hard to read at reduced size; otherwise clear and current UI
  reviewed: true
  seconds: 79.9
  width: 1600
