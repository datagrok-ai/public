    enough to stand alone
  reviewed: true
  width: 689
interactive-statistics.png:
  caption: Statistics for target vs. predicted distributions
  described_blob: 4ce04faeec9797ca09fc176fd599712de4b67e3c
  described_by: claude-sonnet-5
  description: >-
    A table titled "Statistics" compares descriptive statistics for the target distribution and the
