  described_blob: 18ee97c6cfef38e70567399c5ede0bfa25b61eae
  described_by: claude-sonnet-5
  description: >-
    A grid shows clinical trial data with columns for subject ID, age, sex, race, height, weight,
    and demographics. The Stats info pane is expanded in the context panel on the right, and the
    user clicks through different columns (AGE, RACE, HEIGHT) to see its numeric or categorical
    summary statistics update, including count, unique, nulls, min, max, mean, median, and
    quartiles. Hovering over the HEIGHT column header also shows a tooltip with a mini histogram and
    quick stats.
