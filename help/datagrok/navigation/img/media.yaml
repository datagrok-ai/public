    - Click Platform > Plugins
    - Expand My stuff > My files to reveal a personal folder with CSV files
    - Open demog.csv as a data table
    - Open smiles_only.csv showing rendered molecule structures
    - Open peptides_helm_mixed showing rendered peptide sequences
