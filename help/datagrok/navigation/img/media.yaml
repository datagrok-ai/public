console-autocomplete.gif:
  actions:
    - Type a partial command name into the console input
    - View the autocomplete suggestion list appear below
    - Type additional characters to narrow the suggestions
    - Select a suggested, namespaced function name
    - Type another command name to see new suggestions
  caption: Autocompleting commands in the console
  described_blob: 5172a9f75fa034a3c1801443ecd26b5820b6c154
  described_by: claude-sonnet-5
  description: >-
    The Console shows an input box below a history of entered commands (CmdContextHelp(),
    CmdConsole()). As the user types, a dropdown list of matching function names appears below the
    input, and typing further narrows the suggestions, including namespaced entries like
    "core:ReplaceValues". One suggestion is selected and expanded into the full command
    "core:ReplaceValues", then a new query "Viewers:sankeyViewer" is typed.
