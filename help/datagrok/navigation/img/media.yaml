info-panes-colors.gif:
  actions:
    - select a column
    - open the Colors info pane
    - open the Type dropdown and choose Conditional, then Linear
    - open the Scheme dropdown and pick a different color gradient
    - change Apply to from background to text
  caption: Coloring a column by value
  described_blob: 027c5f1190c509056732bd5f637b8ca5582e7ae1
  described_by: claude-sonnet-5
  description: >-
    A grid column named AGE is selected, opening the context panel's Colors section on the right.
    The user opens the Type dropdown and switches it from Off to Conditional, then to Linear, which
    shades each cell's background from dark to light orange based on its age value. The user then
    opens the color Scheme dropdown and picks a blue-to-red gradient with a min/max range of 18-89,
    and finally changes Apply to from background to text, so the numbers themselves are colored
    instead of the cell background.
  height: 1001
  kind: animation
  quality: answer
  reviewed: true
  seconds: 14.1
  width: 1601
