    - hover over the DIS_POP column header to preview its category breakdown
    - open the filter panel and drag a column in to add a SEX filter
    - open the Add New Column dialog from the toolbar
    - open the viewers gallery and add a scatter plot
    - drag columns to build DIS_POP and AGE filters and a faceted scatter plot
