add-to-favorites.gif:
  actions:
    - Open the Projects browser and select an entity (e.g. "Chembl Targets by organism")
    - Star the entity from the context panel to mark it as a favorite
    - Expand the sidebar tree and open the Favorites tab
    - See the newly favorited items listed under Favorites
  caption: Adding an Item to Favorites
  described_blob: 6ff457770bbd15ecdac85926ac852c4c41abd3a4
  described_by: claude-sonnet-5
  description: >-
    The animation shows a Datagrok user browsing entities such as a ChEMBL query and the
    seq_space_demo project in the sidebar and Projects browser, then marking them as favorites. The
    starred items subsequently appear listed under the Favorites tab in the sidebar, alongside the
    existing Tutorials shortcut, confirming they were added.
  height: 1001
  kind: animation
  quality: docs
  quality_notes: >-
    Long, loosely-paced capture that wanders through unrelated panels (Apps tree, Databases tree)
    between the relevant steps, so the favoriting action itself is not tightly framed
  reviewed: true
  seconds: 60.3
  width: 1601
browse.gif:
