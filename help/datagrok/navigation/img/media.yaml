context-panel-stats.gif:
  actions:
    - expand the Stats info pane in the context panel
    - select the AGE column and view its numeric statistics
    - select the RACE column and view its categorical statistics
    - select the HEIGHT column and view its numeric statistics
    - hover over the HEIGHT column header to preview its distribution tooltip
