share-connection.gif:
  actions:
    - Right-click a connection to open its context menu
    - Choose Share...
    - Type a name in the User, group, or email field
    - Select a matching user from the suggestions
    - Type a message
    - Click OK to confirm sharing
  caption: Sharing a connection
  described_blob: 8a38943d14d80f79b8c4bcd2e16198357b1dc00d
  described_by: claude-sonnet-5
  description: >-
    The animation shows the Connections browse view, right-clicking a connection named Fact Forge to
    open its context menu, then choosing Share. A Share Fact Forge dialog appears where the user
    searches for a person by typing "alex", picks Alexander Paramonov from the matching results,
    types a short message ("hi!"), and clicks OK to share the connection with view access.
  height: 500
  kind: animation
  quality: docs
