  described_by: claude-sonnet-5
  description: >-
    A grid named chem_standards has Name and smiles columns showing molecules such as sodium salts
    and their neutral forms. The user opens Chem > Transform > Curate, which shows a Curate dialog
    with options like Kekulization, Normalization, Reionization, Neutralization, Tautomerization,
