chemprop-predict.gif:
  actions:
    - open the ML menu and navigate to Models
    - select Apply Predictive Model
    - choose the trained model to use for predictions
    - click OK to run the model
    - view the resulting predicted-value column
    - open a scatter plot comparing actual and predicted values
  caption: Applying a trained Chemprop model
  described_blob: 06e338b5568a077b688870e749bae214adac477f
  described_by: claude-sonnet-5
  description: >-
    A molecule grid with structures, molregno, and NOCount columns is shown in Datagrok. From the ML
    menu the user opens Models and runs Apply Predictive Model, picking a previously trained model
    that predicts NOCount, then clicks OK to run predictions in batches of 10000. A new NOCount (2)
    column of predicted values appears, and a scatter plot comparing actual versus predicted NOCount
    shows the two roughly correlated.
  height: 879
  kind: animation
  quality: answer
  reviewed: true
  seconds: 26.6
  width: 1854
chemprop-train.gif:
  actions:
    - Open the ML menu and select Models from a molecule table
    - In the Predictive model dialog, check canonical_smiles as the Features column
    - >-
      Set Predict to NOCount and Model Engine to Chem: Chemprop, with regression dataset type and
      default General/Model parameters
    - Click Train and enter a model name ("predict NoCount") in the save dialog
    - Confirm with OK to start training
  caption: Training a Chemprop predictive model
  described_blob: fd3d25ced0db96bab3dfc86ea6ff593dc8906b05
  described_by: claude-sonnet-5
  description: >-
    A molecule table with a canonical_smiles structure column and a NOCount property is used to open
    the ML > Models menu and launch the Predictive model dialog. The user selects canonical_smiles
    as the feature and NOCount as the property to predict, chooses the Chemprop model engine with
    regression settings (RMSE metric, split sizes, network parameters), then names the model
    "predict NoCount" and confirms to start training.
  height: 879
  kind: screenshot
  quality: docs
  quality_notes: >-
    Static-looking dialog screenshots stitched into a gif; low information density per frame and
    small UI text, fine as inline documentation but not a standalone answer.
  reviewed: true
  seconds: 31.9
  width: 1854
