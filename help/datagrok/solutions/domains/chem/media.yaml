scaffold-tree-coloring.gif:
  actions:
    - open the color picker on a root scaffold node
    - pick a custom color and confirm
    - observe the color propagate to child nodes as inherited
    - open the color picker on a child node
    - assign it a distinct custom color, overriding inheritance
  caption: Coloring scaffold tree nodes with inheritance
  described_blob: bfc95bbfb4ba45b3948e22e79f0e2746855a89b1
  described_by: claude-sonnet-5
  description: >-
    A Scaffold Tree panel lists chemical scaffolds as a hierarchy, with a linked molecule grid on
    the left highlighting matching rows. The user opens the color picker for a root scaffold node
    and assigns it a custom color, which then propagates down to its child scaffold nodes (shown by
    a tooltip reading 'color inherited from parent'). Selecting a child node's own color picker and
    assigning it a new color overrides the inherited color, shown with a 'Color picked by user'
    tooltip, while sibling nodes keep the inherited shade.
  height: 822
  illustrates:
    - domains/chem
  kind: animation
  quality: answer
  reviewed: true
  seconds: 26.2
  width: 1158
