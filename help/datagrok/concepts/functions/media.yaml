  width: 337
console-macros.gif:
  actions:
    - click a column header context menu and remove a column
    - open the Add menu
    - open Select Random Rows and set a row percentage
    - select random rows via the toolbar
    - open Select > Duplicates and select duplicate rows
  caption: Recording UI actions as reusable console macros
  described_blob: bdd7338c3234fea8d2e8fc23555f7635e784bc45
  described_by: claude-sonnet-5
  description: >-
    In the Datagrok grid, the user right-clicks a column header, opens the Add menu, and picks
    Select Random Rows and Select Duplicates, each action echoing a corresponding command
    (DeleteColumns, SelectRows, CmdSelectRandomSubset, CmdRemoveSelectedRows, CmdSelectDuplicates)
    in the Console panel on the right. A closing title card reads "Reusable macros for all UI
    actions."
  height: 500
  kind: animation
  quality: docs
  quality_notes: >-
    small UI text is barely legible at this resolution and the demo data table is cluttered; fine
    within its page but not strong enough to stand alone
  reviewed: true
  seconds: 20.1
  width: 800
default-values-from-file.gif:
  actions:
    - open the Model dropdown
    - select a car model from the list
    - observe Mpg, Cyl, Disp, and Hp auto-populate
    - repeat with another model selection
  caption: Auto-filling function parameters from a lookup table
  described_blob: d1dbeef5cb457e18b5b8f9952f3afa321a254085
  described_by: claude-sonnet-5
  description: >-
    A function editor shows a script with input parameters bound to a lookup file, cars.csv. A
    'cars' parameter dialog is open with a Model dropdown and read-only Mpg, Cyl, Disp, and Hp
    fields below it. As different car models are selected from the dropdown (Mazda RX4, Mazda RX4
    Wag, Datsun 710, Hornet 4 Drive), the Mpg, Cyl, Disp, and Hp fields automatically populate with
    the corresponding values from the underlying data table.
