param-visible-enabled-expressions.gif:
  actions:
    - switch the Type dropdown from ICE to Electric
    - observe ICE-only fields hide and Battery Capacity field appear
    - reopen the Type dropdown
    - switch Type back to ICE
    - edit the Tank Volume value to exceed 50
  caption: Visible and enabled expressions for function parameters
  described_blob: 23c2357bd5ea8ac7d9753985d760f2da596ecad1
  described_by: claude-sonnet-5
  description: >-
    A code panel defines a function with input annotations that use visible and enabled expressions:
    the Type dropdown toggles between ICE and Electric, cylinders/tank fields show only for ICE
    while battery capacity shows only for Electric, and the Tank Extension checkbox stays disabled
    until Tank Volume exceeds 50. In the running parameter dialog, the user switches Type from ICE
    to Electric, watching the ICE-only fields disappear and Battery Capacity appear, then reopens
    the dropdown to switch back to ICE and edits Tank Volume toward a value above 50 to enable the
    Tank Extension checkbox.
  height: 373
  illustrates:
    - compute/functions
  kind: screenshot
  quality: docs
  quality_notes: >-
    shows the raw annotation code and a debug alert() call alongside a minimal dev-console dialog
    rather than a real application, so it's clear in context but not self-contained enough to stand
    alone
  reviewed: true
  seconds: 9.1
  width: 642
search-integrated-queries.gif:
  actions:
    - Type a natural-language query into the Search Everywhere bar
    - Refine the query text with a different target name
    - View the matched query's results as a table with linked bar and pie charts
    - Type a second natural-language query for a different function/parameter
    - New query results and viewer load
  caption: Running annotated queries from a natural-language search
  described_blob: c6c7e0f673f0929b60b89c9ef3c1a4e5ac24e9fc
  described_by: claude-sonnet-5
  description: >-
    The Search Everywhere bar is used to type natural-language queries like "bioactivity for
    bacterial targets for Acinetobacter genomosp. 3" and "bioactivity for bacterial targets for
    Shigella"; Datagrok matches an annotated query, extracts the target name as a parameter, and
    runs it, showing a data table of compounds alongside a bar chart of average standard value and a
    pie chart broken down by standard type. A second query, "Pharmacokinetic Data for LEVOFLOXACIN",
    is then typed, and the view transitions to a new query result with another viewer loading in.
  height: 1000
  illustrates:
    - compute/functions
  kind: animation
  quality: answer
  quality_notes: >-
    final frame captured mid-transition with a faded, still-loading viewer, but the preceding frames
    clearly demonstrate the flow end to end
  reviewed: true
  seconds: 23.4
  width: 1600
