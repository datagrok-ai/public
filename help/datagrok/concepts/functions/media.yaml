autocomplete.gif:
  actions:
    - type "Shigella" into the Organism field
    - view the filtered suggestion dropdown
    - clear the field and type "virus"
    - view the new suggestion list
    - type "afri" to narrow it
    - view suggestions filtered to "africa"
  caption: Autocomplete for a function's Organism parameter
  described_blob: 41b8ab9c57e69406da6a2abe24d35bc2efe6d572
  described_by: claude-sonnet-5
  description: >-
    A run dialog for the "Chembl Targets by organism" function shows a Max Number Of Molecules field
    and an Organism text input. As the user types into Organism, a dropdown suggests matching
    values: typing "Shigella" lists Shigella species, and clearing the field and typing "virus" then
    "africa" narrows the list to matching organism names like African swine fever virus.
  height: 261
  illustrates:
    - compute/functions
  kind: animation
  quality: docs
  quality_notes: >-
    small, cropped dialog screenshot with no surrounding app chrome; fine for illustrating the
    annotation but not self-explanatory out of context
