  kind: animation
  quality: answer
  reviewed: true
  seconds: 4.7
  width: 800
dependent-parameters.gif:
  actions:
    - >-
      Open the Ship Country dropdown and select Argentina, which sets Ship City to Buenos Aires and
      Customer Id to CACTU
    - Change Ship Country to Spain, which updates Employee to Callahan
    - Open Ship City and select Madrid
    - Select Barcelona as Ship City, updating Customer Id to GALED
    - Select Sevilla as Ship City, updating Customer Id to GODOS
  caption: Dependent function parameters via dropdowns
  described_blob: 378283515a65a807f3f4b784b5540d4597dc47d7
  described_by: claude-sonnet-5
  description: >-
    A parameter input panel for the function "OrdersByEmployee" shows four dropdown fields: Ship
    Country, Ship City, Customer Id, and Employee. Picking a value in one dropdown automatically
    updates the choices available in the others, showing how a parameter's suggestions or choices
    can reference another parameter's current value.
  height: 248
  illustrates:
    - compute/functions
  kind: animation
  quality: docs
  quality_notes: >-
    Tightly cropped to a small dialog with no surrounding app chrome, and cursor/selection changes
    are easy to miss at this resolution
  reviewed: true
  seconds: 10.2
  width: 292
