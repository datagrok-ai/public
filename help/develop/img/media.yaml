    bottom (vertical split), and the bottom panel nests a horizontal split within a vertical one,
    showing Item 1 beside a column containing Item 2 and Item 3.
  height: 760
  kind: diagram
  quality: docs
  quality_notes: Placeholder-style mockup with generic 'ITEM' labels rather than a real UI screenshot
  reviewed: true
  width: 1200
