splitters.png:
  caption: Splitting the layout horizontally and vertically
  described_blob: b38eb14eea1efb18dbcd98f8bc5b4625089e9b40
  described_by: claude-sonnet-5
  description: >-
    The diagram shows three stacked example panels illustrating splitter layouts. The top panel
