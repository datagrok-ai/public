blocks.png:
  caption: Block layout width variations
  described_blob: b85f8a65d1931b9c12cd46cd113c950becc4ee85
  described_by: claude-sonnet-5
  description: >-
    A diagram shows four rows of dashed-outline rectangles labeled by width percentage: a full-width
