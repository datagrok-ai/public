flexbox.png:
  caption: Flexbox grid layout directions
  described_blob: 7970f3b652e2b8762dc90185ec6e1a35a03409dc
  described_by: claude-sonnet-5
  description: >-
    The diagram shows three flexbox containers stacked vertically, each outlined with a dashed red
    border. The top container arranges three items (Item 1, Item 2, Item 3) side by side in a row.
    The middle container stacks three full-width rows, each labeled Item 1. The bottom container
    combines both: a full-width row labeled Item 1, followed by a nested row containing Item 2 and
    Item 3 side by side.
  height: 600
  kind: diagram
  quality: docs
  quality_notes: Clear and legible but a generic schematic illustration, not a real captured UI screenshot
  reviewed: true
  width: 1200
