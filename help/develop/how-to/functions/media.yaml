semantic-type-detectors.gif:
  actions:
    - hover over the Longitude column header to reveal its detected semantic type tooltip
    - hover over the Magnitude column header to reveal its detected semantic type tooltip
  caption: Detecting semantic types by column stats
  described_blob: c682b00b62d336da01dd0a4a0a1e19d7a444948d
