  description: >-
    An earthquakes data grid is shown with columns DateTime, Latitude, Longitude, Depth, Magnitude,
    and MagType. The cursor hovers successively over the Longitude and Magnitude column headers,
    each time opening a tooltip that shows the detected semantic type name along with
    min/avg/max/std statistics and a distribution histogram, confirming that Datagrok auto-detected
    these columns as Longitude and Magnitude semantic types.
