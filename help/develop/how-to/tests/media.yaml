test_results.gif:
  actions:
    - select a test category in the tree
    - view aggregated results grid in the details panel
    - click ADD TO WORKSPACE
    - explore the results as a table in the workspace
  caption: Reviewing test results in Test Manager
  described_blob: e330e660cee560de600a0f6d2f1f937e5d1606f7
  described_by: claude-sonnet-5
  description: >-
    The Test Manager panel shows the Chem package test tree with a 'substructure search' category
    expanded, listing individual tests with green checkmarks. Clicking a category selects it and the
    right-side details panel switches from a single test's OK/ms result to a grid of all results in
    that category (success, result, ms, category, name columns). The grid is then added to the
    workspace as its own table, where it can be explored with the standard grid tools (Filter,
    Actions, Colors, Stats, Serialization, Dev panels).
  height: 392
  kind: animation
  quality: docs
  quality_notes: >-
    small UI region with truncated columns; useful in context but not self-explanatory as a
    standalone answer
  reviewed: true
  seconds: 12.9
  width: 800
