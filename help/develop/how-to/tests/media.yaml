running_tests.gif:
  actions:
    - right-click a test node in the tree
    - select Run from the context menu
    - click the Run button in the Tests details panel
    - >-
      observe the test icon turn into a green checkmark and the Results panel show OK with a run
      time
  caption: Running a single test in Test Manager
  described_blob: 6113fd20789805e6f59fa953b533f140448efe05
  described_by: claude-sonnet-5
  description: >-
    The TestManager panel of DevTools shows the test tree on the left (Dapi > admin > "Dapi: admin -
    getServiceInfos") and a Tests details panel on the right with package, category and test name.
    The user right-clicks the test node and selects Run from a context menu, then clicks the Run
    button in the details panel; the test completes and the tree node gets a green checkmark while
    the Results section shows "OK" with an elapsed time in milliseconds.
  height: 343
  kind: animation
  quality: docs
  quality_notes: >-
    small UI region, no visible progress bar or fail-icon state despite the surrounding text
    describing those; low information density for a standalone answer
  reviewed: true
  seconds: 17.1
  width: 799
