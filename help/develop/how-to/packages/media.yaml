  described_blob: a20dc439130a1483f971aa7e4b41d5bc1b974378
  described_by: claude-sonnet-5
  description: >-
    Screenshot of the Datagrok Home page showing two dashboard widgets side by side. The left
    "Recent projects" widget lists recently opened projects with thumbnails and names. The right
    "Usage" widget shows Users and Errors sparkline charts over time plus a System status list
    (Datlas, Datlas DB, Grok Connect, Grok Spawner, Jupyter) with color-coded labels, alongside a
    link to open Usage Analysis.
  height: 390
