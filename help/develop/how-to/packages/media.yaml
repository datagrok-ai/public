docker.png:
  caption: Viewing docker container logs in Grok Spawner
  described_blob: d4f1f079d01fd1729bd0e85d5af283a3b326f998
  described_by: claude-sonnet-5
  description: >-
    The Dockers management screen lists running containers and images in cards, grouped under a
    Platform tree with a Dockers node selected. The chem-chem container card is selected, and its
    context panel on the right shows Details, Sharing, Activity, and an expanded Logs section with
    timestamped log lines and an Add to Workspace option. A right-click context menu on another
    container card shows Run and Stop options.
  height: 359
  illustrates:
    - platform/spawner
  kind: screenshot
  quality: docs
  quality_notes: >-
    dense UI with small text and debug-style log data, appropriate for the how-to page but not a
    standalone answer
  reviewed: true
  width: 800
github-actions-publish-status.png:
  caption: GitHub Actions package publish workflow
  described_blob: 2ad79c48adece623c4aea54c3ed4469fbda30175
  described_by: claude-sonnet-5
  description: >-
    A GitHub Actions run log titled "Test and publish to npm (Demo, true, true)", shown succeeded
    after 1m 26s. The left panel lists jobs "Check changes" and "Test and publish to npm", both
    green; the right panel expands the steps of the publish job in order: checkout, Datagrok stand,
    Node setup, npm upgrade and install, js-api dependencies, package build, Datagrok tools install,
    waiting for Datagrok availability, grok CLI configuration, publishing the package to Datagrok,
    testing the package, error notification, artifact upload, and publish to npm.
  height: 1638
  kind: screenshot
  quality: answer
  reviewed: true
  width: 2876
home-page-widgets.png:
