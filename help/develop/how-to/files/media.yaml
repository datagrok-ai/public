file-exporter.gif:
  actions:
    - open the export dropdown menu on the grid
    - click "Save as SDF"
    - choose a location and confirm the filename "smiles.sdf" in the Save As dialog
    - click Save
  caption: Exporting a table as SDF
  described_blob: 2919bd3abf451306e40c88163a37e5f9a548f51f
  described_by: claude-sonnet-5
  description: >-
    A grid of molecules with columns like molregno, canonical_smiles, and computed descriptors is
    shown, each row rendering a chemical structure. The user opens the export menu (the down-arrow
    icon) revealing options including As CSV, As JSON, As Excel Document, As Presentation, and Save
    as SDF, then clicks "Save as SDF". A Save As file dialog appears with the filename "smiles.sdf"
    and type "SDF File (*.sdf)" pre-filled; after saving, the grid is shown again with a tooltip
    revealing a NOCount value on hover.
  height: 501
  kind: animation
  quality: answer
  reviewed: true
  seconds: 13
  width: 800
folder-content-preview.png:
