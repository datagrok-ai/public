grid-adaptive-number-formatting.gif:
  actions:
    - type "grok." to open the namespace autocomplete list
    - select "data" and type "." to list its methods
    - select "parseCsv" and enter the csv string argument
    - open the options object and browse CsvImportOptions properties
    - select "delimiter" and type its value
  caption: Using IntelliSense to call the JS API
  described_blob: 28b79fe5aabd5e60690b43ff1b2d633e570a8aba
  described_by: claude-sonnet-5
  description: >-
    A code editor shows autocomplete suggestions as the developer builds a call to the grok JS API.
    Typing "grok." lists top-level namespaces like data, dapi, and shell; selecting "data" and
    typing "." lists methods such as parseCsv, query, and db. After choosing parseCsv and supplying
    a CSV string argument, the editor offers CsvImportOptions properties (delimiter, headerRow,
    maxRows, etc.), and the developer picks "delimiter" and types its value.
  height: 359
  kind: animation
  quality: docs
  quality_notes: >-
    plain IDE screen capture with no platform UI, useful only as a supporting illustration on the
    page
  reviewed: true
  seconds: 21.9
  width: 866
