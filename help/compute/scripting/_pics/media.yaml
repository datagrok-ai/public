  described_blob: d220263796ecd8579841f6146590b5cbb37fe49b
  described_by: claude-sonnet-5
  description: >-
    A RichFunctionView interface titled "Viewer block option demo" shows a script input dataframe
    named demog rendered as two side-by-side viewers: a Line chart on the left plotting AGE,
    STARTED, and HEIGHT as separate split panels, and a Filters panel on the right listing SEX and
    RACE categories with checkboxes and row counts. The input form and Run button sit in the
    collapsed left sidebar.
  height: 544
  kind: screenshot
  quality: docs
  quality_notes: >-
    clear and readable but a narrow feature-specific example, not a general answer to a broader
    question
  reviewed: true
  width: 1334
viewers-customization.png:
  caption: Customizing viewers for a scripting dataframe
  described_blob: 5bef4ebd5df270c4181cb66db8af467f9a81a7ae
  described_by: claude-sonnet-5
  description: >-
    A grid titled "DF with customized viewers" shows automobile data with columns like model,
    diesel, turbo, two doors, hatchback, wheel base, and length. To its right, a scatter plot charts
    curb weight against model, and below it another scatter plot charts curb weight against
    horsepower with a linear regression line and its equation and r2 value displayed.
  height: 786
  kind: screenshot
  quality: docs
  quality_notes: clear UI capture but shows only the result state, not the customization steps that produced it
  reviewed: true
  width: 1334
viewers-toolbox.png:
  caption: The Viewers toolbox in the sidebar
  described_blob: 4caa44f06bdb956f30918e2bff6cfcb6a1b3f43c
  described_by: claude-sonnet-5
  description: >-
    A demographics table is open in the grid, with the left sidebar expanded to the Viewers panel. A
    red box highlights a grid of viewer-type icons (bar chart, line chart, pie chart, scatter plot,
    box plot, histogram, heat map, and more) that can be dragged or clicked to add a new viewer for
    the dataframe.
  height: 391
  kind: screenshot
  quality: docs
  quality_notes: annotated with a red highlight box rather than a clean native screenshot
  reviewed: true
  width: 909
