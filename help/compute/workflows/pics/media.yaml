    A Model Hub workflow view shows the Steps panel with a "winequalitywf" workflow whose Fetch data
    and Clustering steps are both complete (green checkmarks). The right panel displays the
    Clustering step's output, a scatter plot of PCA1 vs PCA2 colored by cluster, with points grouped
