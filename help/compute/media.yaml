separators-option.gif:
  actions:
    - open the run dialog for the OrdersByEmployee query
    - select Ship Country, Ship City, and Customer Id values
    - type employee last names into the Employee text area
    - run the query and view the results grid
  caption: Using the separators option for a list parameter
  described_blob: e6017d818d3a4f1a96e5f0aece0b51fce7035c95
  described_by: claude-sonnet-5
  description: >-
    The query editor shows a parameterized SQL query with an `employee` input declared as
    `list<string>` using `{inputType: TextArea; separators: ,}`. The animation opens the query's run
    dialog, where Ship Country, Ship City, and Customer Id are filled in, then the Employee text
