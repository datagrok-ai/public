seq-space.gif:
  actions:
    - open Bio > Analyze > Sequence Space menu
    - >-
      configure encoding, fingerprint, similarity/distance method and dimensionality-reduction
      method in the dialog
    - click OK to run the computation
    - view the resulting scatterplot with colored clusters
    - select a cluster of points on the scatterplot
    - inspect the selected rows' sequences and activity in the side panel
  caption: Running sequence space analysis on peptides
  described_blob: c13b0021e9e68fa22c2f3a8d7a9e981f6f9545b8
  described_by: claude-sonnet-5
  description: >-
    A grid of peptide sequences is shown in a Datagrok table. The user opens the Bio > Analyze menu
    and selects Sequence Space, then configures the dialog by choosing a fingerprint type,
    distance/similarity method (Levenshtein, Hamming, monomer chemical distance, Needleman-Wunsch)
    and dimensionality-reduction method (UMAP). After running, a scatterplot titled Sequence space
    appears docked to the table, showing colored clusters of sequences positioned by pairwise
    distance. The user then lasso-selects a cluster of points, and a panel lists the 100 selected
    rows with their sequences and activity values.
  height: 998
  illustrates:
    - explore/dim-reduction
  kind: animation
  quality: answer
  reviewed: true
  seconds: 49
  width: 1608
ui-auto-generation.png:
  caption: Auto-generated UI for a compute script
  described_blob: a9528fc25d164471fd36329ef846e487f98e6bfb
  described_by: claude-sonnet-5
  description: >-
    A three-panel layout shows how a Datagrok compute script becomes an interactive app: on the left
    is the R script with #input and #output annotations, in the middle the auto-generated Inputs
    panel (Dosing options, PK model, PK/PD parameters) with a Run button, and on the right the
    Outputs panel showing a PKPD chart and the Cmax value. Red arrows connect the #input line to the
    generated input fields and the #output line to the generated chart and output value.
  height: 1780
  kind: screenshot
  quality: docs
  quality_notes: >-
    Annotated diagram with overlaid arrows rather than a plain screenshot; code text is small and
    only partially legible at normal viewing size.
  reviewed: true
  width: 3240
