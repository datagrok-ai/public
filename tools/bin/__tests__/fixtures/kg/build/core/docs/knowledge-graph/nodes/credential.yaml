type: credential
extends: infra
prefix: Cred
visibility: internal
description: >
  An entry in the credential inventory (infra/docs/credentials.yaml): what it is,
  where it is stored and how it rotates. Never the secret itself. Exists for SOC 2
  questions and rotation tracking.
properties:
  store:         string
  kind:          string
  rotation:      "'auto' | 'assisted' | 'manual' | 'none'"
  every?:        string
  due?:          Date
  last_rotated?: Date
  hard_expiry?:  Date
