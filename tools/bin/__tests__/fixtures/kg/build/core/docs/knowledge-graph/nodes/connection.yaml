type: connection
extends: component
was: DataConnection
description: >
  A data connection declared in a package's connections/*.json: provider plus endpoint
  for a database, file share or web service. Credentials never enter the graph.
properties:
  language:      "'other'"
  path:          Path
  provider:      string                 # dataSource: Postgres, Snowflake, S3, ...
  server?:       string
  db?:           string
