type: illustrates
from: Media
to: Feature | Concept
key: illustrates
derived_by: [annotation, llm]
description: >
  A media file or video shows a feature or concept in use, as its record asserts: at
  annotation 1.0 when a person wrote the record, as a model proposal at llm 0.6 with status
  proposed when described_by names a model.
  Nothing derives it from where the media is embedded; "shown on a page that documents F" is a
  traversal over embeds and documents, reported with the page as evidence.
properties:
  proposed?:      boolean
