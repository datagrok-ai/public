type: release
extends: work
prefix: Rel
was: Release
visibility: public                      # release notes are public; work subtypes set their own
description: >
  A platform version such as 1.28.0, with its release/<version> branch in both repos
  and its record in core/docs/release/<version>.yaml. Patch releases have Z > 0 and a
  base. Features and tickets reach a release through targets-release.
home: core/docs/release/<version>.yaml
properties:
  version:       Version
  kind:          "'minor' | 'patch'"
  state:         "'development' | 'testing' | 'released'"
  branch:        string
  base?:         Release
  record?:       Path
  dry_run?:      boolean = false        # the record was generated by a rehearsal of the release process, so nothing in it shipped
  released?:     Date
