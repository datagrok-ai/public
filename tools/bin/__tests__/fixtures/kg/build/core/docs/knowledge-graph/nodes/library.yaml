type: library
extends: component
description: >
  A shared TypeScript library under public/libraries (@datagrok-libraries/*) or the
  JS API itself (datagrok-api). Id lib:<name>.
  `package.json` is its record: `description`, `author` and, through the author's email, `owner`.
properties:
  language:      "'ts'"
  npm:           string
  version:       Version
