type: function
extends: component
description: >
  A Datagrok Func registered by an annotation header (//name:, //input:, //meta.role:)
  in a package, a script file, a query, or by @CmdFunc / Command.reg in the Dart
  client. The universal callable. Roles with their own properties are subtypes; every
  other role stays here as a value of roles. Id func:<Package>:<name>.
properties:
  language:      "'ts' | 'js' | 'dart' | 'python' | 'r' | 'julia' | 'octave' | 'sql' | 'grok' | 'other'"
  friendly_name?: string
  roles?:        string[]               # meta.role values; the 39 known ones are validated by grok check
  tags?:         string[]
  signature?:    string                 # "(column mol: Molecule, int n) -> dataframe"
  input_types?:  string[]
  output_types?: string[]
  top_menu?:     string
  help_url?:     Url
  cache?:        "'all' | 'server' | 'client' | 'none' = 'none'"
  demo_path?:    string
  meta?:         Record<string, string> # every other //meta.* key, verbatim
rules:
  - "//feature: in the header, or meta.feature in a @grok.decorators.func call, attaches the function to a feature (is-implemented-in)"
  - "a function with several roles (widgets,panel; viewer,panel; adminApp,app) gets the concrete subtype of its highest-precedence role, in this order: app, viewer, filter, cellRenderer, semTypeDetector, fileHandler, fileExporter, fileViewer, scriptHandler, panel, editor, valueEditor, cellEditor, init, autostart; every role stays in roles"
  - "the registered name (//name: or the decorator's name) is the identity; the source declaration that implements it points at it with declares"
