packages:
  - packages/*
  - libraries/*
  - js-api
  - tools
  - build-config

# One version of each shared tool for the whole repo. A package refers to these as
# "name": "catalog:" and never pins its own copy. Libraries the platform serves at
# runtime (rxjs, vue, openchemlib, ...) join this catalog from build-config/platform-deps.json
# via .pnpmfile.cjs.
catalog:
  typescript: ^7.0.2
  '@types/node': ^22.0.0
  '@types/wu': ^2.1.44

# Security floors for what Notebooks' @jupyterlab 2.x chain pins. They mirror the "overrides"
# in packages/Notebooks/package.json, which the npm audit of the published package reads.
overrides:
  'url-parse@<1.5.10': ^1.5.10
  'marked@<4.0.10': ^4.3.0
  'sanitize-html@<2.17.0': ^2.17.0
  'codemirror@>=5.0.0 <5.58.2': ^5.58.2

# pnpm 10 blocks postinstall scripts unless allowed here. puppeteer is deliberately not
# allowed: its Chromium download is ~150 MB per version and irrelevant to building.
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
  - sharp
  - bufferutil
  - utf-8-validate
  - core-js
  - core-js-pure
