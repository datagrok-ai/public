# JS API debugging: bind-mounts a locally built js-api over the one in the image.
#
# This is an OVERLAY, not a standalone stack — it overrides the `datagrok` service and
# relies on the base file for `db` and the rest. Always pass both files, base first:
#
#   docker compose -f localhost.docker-compose.yaml -f localhost.js-api.debug.docker-compose.yaml \
#     --project-name datagrok --profile all up -d
#
# This file is bound to a single release train. `x-datagrok-release` names it, and every
# datagrok/* image below defaults to a tag from that train. The compose file and the images
# it starts must always come from the same train — pairing them across trains makes the
# server fail to start. See `localhost.docker-compose.yaml` for the full rationale.
x-datagrok-release: bleeding-edge

services:
  datagrok:
    privileged: true
    image: datagrok/datagrok:${DATAGROK_VERSION:-bleeding-edge}
    environment:
      GROK_PARAMETERS: |
        {
          "deployDemo": false,
          "dbServer": "database",
          "db": "datagrok",
          "dbAdminLogin": "postgres",
          "dbAdminPassword": "postgres",
          "dbLogin": "dg",
          "dbPassword": "dg",
          "adminPassword": "admin",
          "adminDevKey": "admin",
          "isolatesCount": 2
        }
    ports:
      - "${DATAGROK_PORT:-8080}:8080/tcp"
    networks:
      datagrok:
        aliases:
          - datagrok
    depends_on:
      db:
        condition: service_healthy
        restart: false
    volumes:
      - datagrok_data:/home/grok/data
      - datagrok_cfg:/home/grok/cfg
      - type: bind
        source: ${FULL_PATH_TO_BUILD_JS_API:-./../js-api/../../xamgle/web/js/api}
        target: /home/grok/datagrok/html.build/web/js/api
    restart: unless-stopped
    profiles: ["all", "datagrok"]

volumes:
  datagrok_data:
  datagrok_cfg:

networks:
  datagrok:
