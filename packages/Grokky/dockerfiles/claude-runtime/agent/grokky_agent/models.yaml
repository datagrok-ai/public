# The catalog models a provider's model ids map to, the only ones a turn may run on: family, context window in
# tokens, image input, and prices in USD per million tokens. A prompt over `above_tokens` (its cache reads and writes
# included) is billed whole at the long-context rates. `always_reasons`: the model rejects reasoning effort `none`
# (https://developers.openai.com/api/docs/guides/reasoning). Read on 2026-10-20 from
# Claude: https://platform.claude.com/docs/en/about-claude/pricing (5-minute cache writes)
#         https://platform.claude.com/docs/en/about-claude/models/overview
# GPT:    https://developers.openai.com/api/docs/pricing (Standard)
#         https://developers.openai.com/api/docs/models (per model: context window, image input)
claude-haiku-5-5:
  family: claude
  context: 1000000
  images: true
  prices:
    base: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
    long_context: {above_tokens: 100000, input: 0.50, output: 2.50, cache_read: 0.05, cache_write: 0.625}
