# The models a turn may name, with their prices in USD per million tokens
# (https://platform.claude.com/docs/en/about-claude/pricing). A turn naming another model is refused.
default: claude-sonnet-5-5
prices:
  claude-haiku-5-5:
    base: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
    long_context: {above_tokens: 100000, input: 0.50, output: 2.50, cache_read: 0.05, cache_write: 0.625}
  claude-sonnet-5-5:
    base: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-opus-5-5:
    base: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
