[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "agent"
files = ["agent/grokky_agent"]

[[tool.mypy.overrides]]
module = ["run_agent", "model_tools", "hermes_constants", "hermes_state", "hermes_state_registry", "hermes_cli.*",
          "tools.*", "agent.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["agent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
