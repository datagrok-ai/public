overview: |
  Registers, tracks, and searches chemical compounds, batches, additions,
  assays, assay runs and assay results, stored in the package's moltrack
  domain schema.

  Home: Browse > Apps > Chem > MolTrack. Landing view shows how many of each
  entity are registered, each count opening its list, next to quick actions.
  Left tree: Compounds, Batches, Assays, Assay Runs, Assay Results, Additions.

  Registration: Compounds > New opens the compound form. The structure is
  standardized in the browser and identified by its registration hash, so a
  duplicate, or a salt of a registered parent, is named before Save, and Save
  is refused. Save gives the compound its Grok ID (DG-000060). Batches are
  added on the compound's Batches tab and get batch IDs (DGB-000365).

  Bulk registration: Compounds > ⋯ > Import (Batches > ⋯ > Import for
  batches). Every row of the table is previewed as new, already registered,
  repeated or unreadable; the Grok IDs are written back to the table.

  Search: every list has a filter builder over any column, with nested
  conditions. Compounds also search by structure: has substructure, is
  substructure of, is similar to, is exactly.

  Links: a Grok ID typed in the Compounds or Batches search opens that record;
  ?corporate_compound_id= and ?corporate_batch_id= links open one directly.
apiRef: src/package-api.ts
