name: myenv
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit
  - joblib
  - numpy<2.0.0
  - pandas
  - scikit-learn
  - scipy
  - boto3
  - urllib3>=2.8
  - idna>=3.15
  - pyarrow>=23.0.1
  - brotli>=1.2
  - pip
  # cu126 wheels bundle their own CUDA runtime (no CUDA base image needed) and still run on
  # pre-580 drivers; torch falls back to CPU when no GPU is present.
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1+cu126
      - chemprop==2.0.4
      - datagrok-celery-task==0.1.8
      - celery
      - aiohttp>=3.14.4
      - multidict>=6.9.1
